{{ define "meta_tags" }}
<meta name="robots" content="noindex, nofollow, noarchive">
{{ end }}

{{ define "main" }}
<style>
  .private-gallery {
    --gallery-ink: #172033;
    --gallery-muted: #59667a;
    --gallery-line: #d8dee8;
    --gallery-accent: #b83232;
    max-width: 1180px;
    margin: 0 auto;
    padding: 48px 20px 72px;
    color: var(--gallery-ink);
  }

  .private-gallery__header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--gallery-line);
    padding-bottom: 22px;
  }

  .private-gallery__title {
    margin: 0;
    font-size: clamp(2rem, 4vw, 3.25rem);
    line-height: 1.05;
    font-weight: 800;
  }

  .private-gallery__count {
    margin: 0 0 6px;
    color: var(--gallery-muted);
    font-size: 0.95rem;
    white-space: nowrap;
  }

  .private-gallery__grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
  }

  .private-gallery__button {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    border: 0;
    border-radius: 6px;
    overflow: hidden;
    padding: 0;
    background: #eef1f5;
    cursor: zoom-in;
  }

  .private-gallery__button:focus-visible {
    outline: 3px solid var(--gallery-accent);
    outline-offset: 3px;
  }

  .private-gallery__image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform 180ms ease, filter 180ms ease;
  }

  .private-gallery__button:hover .private-gallery__image {
    transform: scale(1.035);
    filter: saturate(1.05);
  }

  .private-gallery__dialog {
    width: min(92vw, 1180px);
    max-height: 92vh;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
  }

  .private-gallery__dialog::backdrop {
    background: rgba(7, 12, 22, 0.82);
  }

  .private-gallery__dialog-frame {
    position: relative;
    background: #0b1020;
  }

  .private-gallery__dialog-image {
    width: 100%;
    max-height: 92vh;
    display: block;
    object-fit: contain;
  }

  .private-gallery__close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 42px;
    height: 42px;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 50%;
    background: rgba(10, 15, 28, 0.7);
    color: #fff;
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
  }

  @media (max-width: 640px) {
    .private-gallery {
      padding: 32px 14px 56px;
    }

    .private-gallery__header {
      display: block;
    }

    .private-gallery__count {
      margin-top: 10px;
    }

    .private-gallery__grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
  }
</style>

<section class="private-gallery" aria-labelledby="private-gallery-title">
  <header class="private-gallery__header">
    <h1 id="private-gallery-title" class="private-gallery__title">{{ .Title }}</h1>
    <p class="private-gallery__count">{{ .Params.photo_count }} photos</p>
  </header>

  <div class="private-gallery__grid">
    {{ range seq 1 .Params.photo_count }}
      {{ $src := printf "/private-gallery/images/photo-%03d.jpg" . }}
      <button class="private-gallery__button" type="button" data-gallery-src="{{ $src | relURL }}" aria-label="Open photo {{ . }}">
        <img class="private-gallery__image" src="{{ $src | relURL }}" alt="Exclusive photo {{ . }}" loading="lazy" decoding="async">
      </button>
    {{ end }}
  </div>

  <dialog class="private-gallery__dialog" aria-label="Photo preview">
    <div class="private-gallery__dialog-frame">
      <button class="private-gallery__close" type="button" aria-label="Close photo preview">&times;</button>
      <img class="private-gallery__dialog-image" alt="">
    </div>
  </dialog>
</section>

<script>
  (() => {
    const dialog = document.querySelector(".private-gallery__dialog");
    const image = document.querySelector(".private-gallery__dialog-image");
    const close = document.querySelector(".private-gallery__close");

    document.querySelectorAll("[data-gallery-src]").forEach((button) => {
      button.addEventListener("click", () => {
        image.src = button.dataset.gallerySrc;
        image.alt = button.querySelector("img").alt;
        if (typeof dialog.showModal === "function") {
          dialog.showModal();
        }
      });
    });

    close.addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", (event) => {
      if (event.target === dialog) {
        dialog.close();
      }
    });
  })();
</script>
{{ end }}
